    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "p") {
          var pairs = l.search.slice(1).split("&");
          var q = {};
          pairs.forEach(function (pair) {
            var kv = pair.split("=");
            q[kv[0]] = kv[1];
          });
          if (q.p !== undefined) {
            window.history.replaceState(
              null,
              null,
              l.pathname.slice(0, -1) +
                (q.p ? "/" + q.p.replace(/~and~/g, "&") : "") +
                l.hash,
            );
          }
        }
      })(window.location);
    </script>
